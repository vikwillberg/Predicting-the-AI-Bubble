name: ICARUS pipeline

# Scrapes fresh market, macro, fundamental and attention data, validates it,
# re-runs every model and commits the updated forecast, figures and dashboard.

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "icarus/**"
      - "sql/**"
      - "engine/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: "27 22 * * 1-5"   # weekdays 22:27 UTC, after the US close
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Reuse the committed data snapshot instead of scraping"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scrape data
        if: ${{ !inputs.skip_ingest }}
        run: python -m icarus ingest

      - name: Validate data
        run: python -m icarus validate

      - name: Commit snapshot
        run: |
          git config user.name "icarus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "data: refresh snapshot $(date -u +%F)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
