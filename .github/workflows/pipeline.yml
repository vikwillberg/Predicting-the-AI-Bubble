name: ICARUS pipeline

# Every week: scrape fresh market, macro, fundamental and attention data, run the
# quality gate, rebuild the SQL warehouse, rerun every model, and commit the new
# forecast, figures, dashboard and README results block.

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "icarus/**"
      - "sql/**"
      - "engine/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"
  schedule:
    - cron: "27 22 * * 1"   # Mondays 22:27 UTC, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the Go LPPLS engine
        run: cd engine && go build -o ../bin/lppls ./cmd/lppls

      - name: Scrape data
        run: python -m icarus ingest

      - name: Validate data
        run: python -m icarus validate

      - name: Warehouse, models and report
        run: python -m icarus all

      - name: Upload the data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: icarus-data-${{ github.run_id }}
          path: |
            data/raw
            reports/results.json
          retention-days: 90

      # This run checked out the commit that triggered it, but the branch may have
      # moved since (a code push, or another run's results). Merging regenerated
      # charts and JSON conflicts, so instead: move to the newest commit, put this
      # run's results back, re-render every output from them, and push. Generated
      # files are rebuilt rather than merged, so concurrent runs can't conflict.
      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "icarus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          keep="$(mktemp -d)"
          cp reports/results.json data/raw/manifest.json data/raw/validation_report.json "$keep/"
          for i in 1 2 3 4; do
            git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
            git reset -q --hard FETCH_HEAD
            cp "$keep/results.json" reports/results.json
            cp "$keep/manifest.json" "$keep/validation_report.json" data/raw/
            python -m icarus report
            git add reports docs README.md data/raw/manifest.json data/raw/validation_report.json
            if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
            git commit -q -m "pipeline: refresh forecast ($(date -u +%F))"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
