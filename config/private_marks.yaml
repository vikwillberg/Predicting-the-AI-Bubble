# Private-market and IPO marks for frontier AI labs, collected by web research.
# These can't be scraped from an API, so each point is curated by hand with its
# source and a confidence level:
#   high   = company announcement or consistent reporting across major outlets
#   medium = consistent secondary reporting, not verified against a primary filing
#   low    = single source, conflicting reports, or a target rather than a done deal
# Figures are in USD billions. run_rate_b is annualized revenue run-rate (usually
# latest month x 12) as reported at or near the valuation date.
as_of: "2026-11-03"

